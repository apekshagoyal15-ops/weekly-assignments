
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        color: #12203a;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px;
        background: #12203a;
        color: white;
    }

    nav ul {
        display: flex;
        gap: 20px;
        list-style: none;
    }

    nav a {
        color: white;
        text-decoration: none;
    }

    .btn {
        background: #ffb703;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>
<body>

    <nav>
        <h2>CodeLab</h2>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <button class="btn">Sign Up</button>
    </nav>

    <section class="hero" id="home">
        <h1>Learn Web Development</h1>
        <p>Start from zero. Build real projects.</p>
        <button class="btn">Get Started</button>
    </section>

    <section class="cards" id="courses">
        <div class="card">
            <h3>HTML</h3>
            <p>Build the structure.</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Make it beautiful.</p>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>Make it interactive.</p>
        </div>

        <div class="card">
            <h3>Git</h3>
            <p>Save your work.</p>
        </div>
    </section>

    <footer id="contact">Made with HTML and CSS</footer>

</body>
</html>
