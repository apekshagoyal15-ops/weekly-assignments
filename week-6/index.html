<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef2f8;
    }

    header {
        background: #12203a;
        color: white;
        padding: 14px;
        text-align: center;
    }

    .card {
        width: 280px;
        margin: 24px auto;
        background: white;
        border: 2px solid #2f5bea;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
    }
</style>
</head>
<body>

    <header>My Profile Page</header>

    <main>
        <div class="card">
            <div class="avatar">A</div>
            <h2>Apeksha Goyal</h2>
            <p>B.Tech CSE (AI/ML) Student</p>
        </div>
    </main>

</body>
</html>
