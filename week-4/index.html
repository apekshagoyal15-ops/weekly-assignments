<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Coding Club events and student registration">
    <title>Coding Club</title>
    <style>
    /* CSS Variables */
    :root {
        --brand: #b76e79;
        --light: #b76e79;
        --dark: #090811;
        --gap: 16px;
    }
    /* Universal Selector */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Element Selector */
body {
    font-family: Arial, sans-serif;
    background: var(--light);
    color: var(--dark);
    line-height: 1.6;
    padding: var(--gap);
}

h1 {
    font-size: 2.2rem;
    letter-spacing: 1px;
}

h2 {
    margin-bottom: 12px;
}
  /* ID Selector */
#hero {
    background: var(--brand);
    color: rgb(16, 18, 18);
    text-align: center;
    padding: 32px var(--gap);
    border-radius: 10px;
}

/* Class Selector */
.card {
    background: #f3d9df;
    padding: var(--gap);
    margin-top: var(--gap);
    border-radius: 10px;
}
</style>
    <link rel="icon" href="favicon.ico">
</head>

<body>
        <!-- Navigation -->
    <nav>
        <a href="#events">Events</a> |
        <a href="#register">Register</a>
    </nav>

    <header id="hero">
    <h1>Coding Club</h1>
    <p>Learn. Build. Share.</p>
</header>

    <p>Welcome to our Coding Club!</p>
        <!-- Upcoming Events Section -->
        <section class="card">
        <h2 id="events">Upcoming Events</h2>

    <table border="1">

        <caption>Club Events</caption>

        <thead>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>HTML Workshop</td>
                <td>12 Nov</td>
                <td>Lab 1</td>
            </tr>

            <tr>
                <td>Hackathon</td>
                <td>20 Nov</td>
                <td>Seminar Hall</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total events: 2</td>
            </tr>
        </tfoot>

    </table>
    </section>
    
        <!-- Registration Form -->
    <h2 id="register">Register for the Coding Club</h2>

    <form action="#" method="post">

        <!-- Name -->
        <p>
            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >
        </p>

        <!-- Email -->
        <p>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </p>

        <!-- Password -->
        <p>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </p>

        <!-- Date of Birth -->
        <p>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </p>

        <!-- Phone -->
        <p>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
        </p>

        <!-- Gender -->
        <p>
            Gender:

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </p>

        <!-- Interests -->
        <p>
            Interests:

            <input type="checkbox" id="web" name="interests" value="web">
            <label for="web">Web Development</label>

            <input type="checkbox" id="dsa" name="interests" value="dsa">
            <label for="dsa">DSA</label>
        </p>

        <!-- Branch Dropdown -->
        <p>
            <label for="branch">Branch:</label>

            <select id="branch" name="branch">
                <option value="btech">B.Tech</option>
                <option value="bca">BCA</option>
                <option value="other">Other</option>
            </select>
        </p>

        <!-- Message -->
        <p>
            <label for="message">Why do you want to join?</label>
            <br>

            <textarea
                id="message"
                name="message"
                rows="4"
                cols="30"
            ></textarea>
        </p>

        <!-- Submit Button -->
        <button type="submit">Register</button>

    </form>

</body>

</html>
